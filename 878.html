  async function startAudio(M) {

  // ---- debug: window.rxcDump(glTexture, w, h, isFloat, name) reads a render target back from the graphics worker and POSTs it
  // as a PNG to the dev server (tools/serve_web.py -> build/<name>/shots/<name>.png). Texture ids come from the pass log
  // (window.rexcomp.gfxWorker.postMessage({passlog: 1}), lines "-> rt texN").
  window.rxcProfile = async (ms, name) => {

    c.convertToBlob({ type: 'image/png' }).then(b => fetch('/upload/' + im.name + '.png', { method: 'POST', body: b })).then(() => console.log('[dump] uploaded ' + im.name));
  }

  const PROG_KEY = 'rxcPrograms';
  const loadLearned = () => { try { const a = JSON.parse(localStorage.getItem(PROG_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };

    const cur = globalThis.__rxcPrograms; if (!cur || !cur.length) return;
    try { const all = new Set(loadLearned()); for (const k of cur) all.add(k); localStorage.setItem(PROG_KEY, JSON.stringify([...all].slice(-8000))); } catch (e) {}
  };

  // ---- start
  const bar = $('bar').firstElementChild;
  let splitLoader;
  async function downloadAssets() {
    const response = await fetch('split-assets.json', {cache: 'no-cache'});
    if (!response.ok) throw new Error(`Could not load split-assets.json (HTTP ${response.status})`);
    const allAssets = await response.json();
    const dataBase = new URL((q.get('base') || GAME_BASE || './').replace(/\/?$/, '/'), document.baseURI).href;
    const assets = allAssets.filter(asset => !asset.url.endsWith('.wasm') ||
      (firefox ? asset.url.startsWith('gbb_fflean') : asset.url === 'gbb.wasm'))
      .map(asset => ({...asset, baseURL: asset.gameData ? dataBase : document.baseURI}));

      bar.style.width = (total ? Math.min(100, 100 * loaded / total) : 0) + '%';
    }});
    await splitLoader.download();
  }
  const loadEngine = threaded => new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = threaded ? 'gbb_mt.js' : firefox ? 'gbb_fflean.js' : 'gbb.js';
    script.onload = resolve; script.onerror = () => reject(new Error('Could not load the game engine.'));
    document.head.appendChild(script);
  });
  $('play').onclick = async () => {
    if (started) return; started = true; checkingPackages = true;
    startupLogStart = performance.now(); startupLogActive = true; startupLog.textContent = '[0.0s] Starting…\n';
    $('play').disabled = true; mt.disabled = true; status('Downloading game…');
    mt.checked = false;
    const threaded = false;
    try { await downloadAssets(); } catch (error) { packageError(error); return; }
    if (packageFailed) return;
    status('Preparing engine…');
    const t0 = performance.now();
    M = {
      locateFile: path => new URL(path, document.baseURI).href,
      canvas, arguments: [launchArgs()], yieldMode: 'mc',
      // ?mt=N: N guest threads get a host thread of their own (0 = the threaded module, still cooperative)
      gameBase: q.get('base') || GAME_BASE,
      iniSeed: [{ file: 'C:/Users/Player/AppData/Local/Unreal Engine/Engine/Config/UserEngine.ini', section: 'SystemSettings', values: { 'r.MotionBlurQuality': '0', 'r.DefaultFeature.MotionBlur': '0', 'r.AntiAliasingMethod': '1', 'r.TranslucencyLightingVolumeDim': '32', 'r.ViewDistanceScale': '0.8', 'r.LightMaxDrawDistanceScale': '0.85', 'r.MinScreenRadiusForDepthPrepass': '0.04', 'r.MinScreenRadiusForLights': '0.04', 'r.MinScreenRadiusForCSMDepth': '0.015' } }],

      print: s => { console.log(s); if (globalThis.__rxcSink) globalThis.__rxcSink.push(s); },
      printErr: s => { console.error(s); if (globalThis.__rxcSink) globalThis.__rxcSink.push(s); },
      // These callbacks consume merged Blobs; their bytes were already counted.

      onPackageProgress: () => {},
      onStatus: s => {

      onFirstFrame: () => { flushStartupLog(); startupLogActive = false; bar.parentElement.classList.remove('indeterminate'); bar.style.width = '100%'; $('overlay').classList.add('hidden'); canvas.focus(); },

})();
