        position: absolute;
        height: 190%;
        width: 5%;
        background: #fff;
        transform: translateY(-50%);
        top: 50%;
        display: inline-flex;
        background-color: #269fba;
        animation: LL_LoadingAnimation 4s ease-in-out infinite;
        position: relative;
        z-index: 10;
        border: 4px solid #d5d8de;
        transition: width 0.5s ease-in-out;
        min-width: 4%;

      #ll_progressbar > #ll_loadinglabel {
        position: absolute;
        z-index: 20;
        top: 50%;
        text-transform: uppercase;
        border-radius: 7px;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 16px;
        color: #33373f;
      }

      @keyframes ShowStandaloneBannerAfterDelay {

        }

        95% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

        text-align: center;
        color: #777a7f;
        margin-top: 30px;
        display: block;
        font-size: 16px;
        animation: ShowStandaloneBannerAfterDelay 60s linear;
      }

      #ll_standalone a {
        color: #39f;
        margin-left: 5px;
        font-weight: 700;
      }

      #ll_logo > img {
        width: 40vw;
        max-width: 700px;
        min-width: 150px;
      }

      #ll_loader > .ll_spinner {
        width: 80px;
        height: 80px;
        display: inline-flex;
        background: center center/contain no-repeat;
        display: none;
      }

      #ll_preload_status {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
        opacity: 1 !important;
        font-size: 18px;
        color: rgba(0, 10, 20, 0.5);
        font-family: GameFont, Arial, sans-serif;

      #ll_preload_error > .inner > .heading {
        color: #ef5072;
        margin-bottom: 40px;
        font-size: 45px;

      #ll_preload_error > .inner > .content {
        color: #55585f;
        font-family: monospace;
        text-align: left;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);

      #ll_preload_error > .inner .discordLink strong {
        font-weight: 900 !important;
      }

      #ll_preload_error > .inner .source {
        color: #777;
      }
