            --controls-size: 10vh;
        }

        @media (orientation: landscape) {
            :root {
                --controls-size: 20vh;
            }
        }

        html {
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            margin: 0;
            color: white;
            background: black;
        }

        .unselectable {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #status {
            font-size: 1.5rem;
            color: var(--color-gray);
            text-align: center;
        }

        #controls {
            position: relative;
            text-align: right;
            z-index: 10;
        }

        #controls button {
            -webkit-appearance: button;
            display: inline-flex;
            background: transparent;
            border: 0;
            color: white;
            font-family: inherit;
            font-size: 1em;
            line-height: inherit;
            cursor: pointer;
            padding: 0.5rem;
        }

        #controls svg {
            pointer-events: none;
        }

        #canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform: translate(-50%, -50%);
        }

        img#canvas {
            object-fit: contain;
        }

        #dpad,
        #apad {
            position: fixed;
            bottom: 1rem;
        }

        #dpad {
            left: 1rem;
        }

        #apad {
            right: 1rem;
        }

        #dpad svg {
            width: calc(2 * var(--controls-size));
            height: calc(2 * var(--controls-size));
            fill: var(--color-gray);
        }

        #dpad svg rect {
            opacity: 0.4;
        }

        #apad>* {
            width: var(--controls-size);
            height: var(--controls-size);
            background-color: var(--color-gray);
            border-radius: 50%;
        }

        #apad> :last-child {
            position: relative;
            right: var(--controls-size);
        }

        #dpad path:not(.active),
        #apad>*:not(.active) {
            opacity: 0.4;
        }
